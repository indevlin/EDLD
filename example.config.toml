# ==============================================================================
# [REMOTE] profile — dashboard front-end for remote monitoring
# ==============================================================================
# Used when running EDLD on a second machine (e.g. a laptop) against a game
# machine's journal directory, mounted via sshfs.
#
# Discord is intentionally disabled — the game machine's EDLD instance handles
# all webhook output — and PrimaryInstance = false stops this instance repeating
# the game machine's EDDN, EDSM, EDAstro and Inara uploads. Every notification
# is kept to this machine's terminal (level 1) or off (0).  The game machine
# runs the automation and the backups; this one does neither.
#
# See docs/guides/REMOTE_ACCESS.md for full setup instructions.
# ==============================================================================

[REMOTE]
Settings.JournalFolder   = "/home/username/mnt/ed-journals"
Settings.PrimaryInstance = false   # no EDDN/EDSM/EDAstro/Inara uploads, no overlay
UI.Interface             = "textual"   # a remote dashboard in a terminal
UI.Theme                 = "default"
Discord.WebhookURL       = ""
Discord.UserID           = 0
Discord.Identity         = false
Automation.Enabled       = false
Backups.Enabled          = false
Callouts.Sounds          = false
LogLevels.InboundScan          = 1
LogLevels.RewardEvent          = 1
LogLevels.FighterDamage        = 1
LogLevels.FighterLost          = 1
LogLevels.ShieldEvent          = 1
LogLevels.HullEvent            = 1
LogLevels.Died                 = 1
LogLevels.CargoLost            = 1
LogLevels.LowCargoValue        = 1
